# ext-mybatis points at the it-mybatis-config.xml (the historically-leaking config).
quarkus.mybatis.config-files=it-mybatis-config.xml

# Small Agroal pool (max=4) so pool exhaustion appears fast if the leak regresses.
# Lazy pool (min/initial=0) so the app boots even when PG is down (tests self-skip via assumeTrue).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=krpc
quarkus.datasource.password=krpc
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/krpc_test?ApplicationName=extmyb-it-pool
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.acquisition-timeout=3

quarkus.log.level=WARN

# This QuarkusUnitTest does not import the quarkus-bom platform descriptor, so the default
# ${platform.quarkus.native.builder-image} placeholder cannot expand at build-time config read.
# Pin a concrete value (never used — JVM test, no native build) to satisfy validation.
quarkus.native.builder-image=graalvm
