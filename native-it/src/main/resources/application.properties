# native-it datasource → PostgreSQL 17.
# Matches the local dev PG (localhost:5433, krpc_test/krpc/krpc) the mybatis module's
# PostgresPagingIntegrationTest already uses, AND the PG service container the native-smoke
# workflow starts with the same db/user/password mapped to host port 5433 — so this file is
# identical for local runs and CI (no env overrides needed). Any value can still be overridden
# at runtime via QUARKUS_DATASOURCE_* env vars if a different PG is used.
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = krpc
quarkus.datasource.password = krpc
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5433/krpc_test

# ext-mybatis config file (default is already mybatis-config.xml; explicit for clarity).
quarkus.mybatis.config-files = mybatis-config.xml

quarkus.log.level = INFO
%dev.quarkus.log.level = DEBUG
quarkus.log.category."org.apache.ibatis".level = INFO
quarkus.log.category."tech.krpc.mybatis".level = INFO
