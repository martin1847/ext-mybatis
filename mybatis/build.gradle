group = "tech.krpc.mybatis"
//version = '1.0.0'
dependencies {
    api 'org.mybatis:mybatis:3.5.19'

    //JSON util
    compileOnly "tech.krpc:rpc-common:$rpcVersion"
//    api project(':model')


    // or one line testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    // Gradle 9 no longer puts the JUnit Platform launcher on the test runtime classpath; declare it explicitly.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'

    testImplementation 'com.mysql:mysql-connector-j:8.4.0'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.4'
    testImplementation 'org.slf4j:slf4j-simple:1.7.36'

    // EXTMYB-STRICT-001 (test-only): JsonUtils — the JSON decoder AbstractJsonListHandler calls —
    // lives in rpc-common, which the MAIN source set deliberately takes compileOnly. The decoding
    // matrix drives the real handler, so it needs the real decoder at TEST runtime. Test scope
    // only: nothing about the published POM changes.
    testImplementation "tech.krpc:rpc-common:$rpcVersion"
}

compileJava{
    options.compilerArgs += [
            '--add-exports', 'jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED,ALL-UNNAMED',
            '--add-exports', 'jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED,ALL-UNNAMED',
            '--add-exports', 'jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED,ALL-UNNAMED',
            '--add-exports', 'jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED,ALL-UNNAMED',
            '--add-exports', 'jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED,ALL-UNNAMED'
        ]
}

// ---------------------------------------------------------------------------------------------
// EXTMYB-STRICT-001 — the JSON strict-decoding behaviour matrix.
//
// JsonUtils resolves the KRPC_JSON_STRICT kill switch once and caches it in a private static
// field, and a Jackson ObjectMapper cannot be reconfigured after first use: ONE JVM can observe
// exactly ONE switch state. The two expectation sets therefore run as two separate forked test
// tasks with explicitly-built environments, and the default `test` task must not run either of
// them (it would inherit whatever the developer's shell happens to export).
// ---------------------------------------------------------------------------------------------

def matrixClasses = [
        strict : 'tech.krpc.mybatis.type.JsonStrictMatrixStrictModeTest',
        lenient: 'tech.krpc.mybatis.type.JsonStrictMatrixLenientModeTest',
]

/** Parent environment minus the kill switch, plus the overrides this mode needs. */
def matrixEnvironment = { Map<String, String> overrides ->
    def env = new LinkedHashMap<String, String>(System.getenv())
    env.remove('KRPC_JSON_STRICT')
    env.putAll(overrides)
    return env
}

def registerMatrixTest = { String taskName, String mode, Map<String, String> overrides, String why ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = why
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        filter { includeTestsMatching matrixClasses[mode] }
        environment = matrixEnvironment(overrides)
        systemProperty 'strict.matrix.mode', mode
        maxParallelForks = 1
        // The run also emits provenance evidence (build/strict-matrix-evidence/), which must
        // reflect THIS run rather than a cached one.
        outputs.upToDateWhen { false }
        testLogging {
            events 'passed', 'failed'
            exceptionFormat 'full'
        }
    }
}

registerMatrixTest('strictMatrixTest', 'strict', [:],
        'JSON decoding matrix with KRPC_JSON_STRICT explicitly ABSENT (1.2.0 default: strict).')
registerMatrixTest('lenientMatrixTest', 'lenient', ['KRPC_JSON_STRICT': 'false'],
        'JSON decoding matrix with the KRPC_JSON_STRICT kill switch thrown (pre-1.2 semantics).')

tasks.named('test') {
    matrixClasses.values().each { filter.excludeTestsMatching it }
    dependsOn 'strictMatrixTest', 'lenientMatrixTest'
}